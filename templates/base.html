<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Find your stay{% endblock %} · Vilas</title>
  <meta name="description" content="Vilas — search, reserve and manage hotel rooms. Reserve rooms, order food, and watch availability live.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070b14'/%3E%3Cpath d='M16 5.5l3.4 6.1 6.1 3.4-6.1 3.4L16 25.5l-3.4-7.1-6.1-3.4 6.1-3.4z' fill='%23c9a44c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-page="{{ active }}" data-slug="{{ slug|default('') }}">

  <div class="scroll-progress" id="scrollProgress"></div>

  {% include '_nav.html' %}

  <main>{% block content %}{% endblock %}</main>

  {% include '_footer.html' %}

  <div class="toast-root" id="toastRoot"></div>

  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  {% block pagescript %}{% endblock %}
</body>
</html>
